[project]
name = "authentix-chatbot-service"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # assert is fine in tests; long SQL and message strings are fine too
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "E501", "S324"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
