name: authentix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-authentix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # dev only: lets the integration tests reach Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authentix}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379" # dev only: lets the integration tests reach Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-authentix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mock-uidai:
    # Fake UIDAI for dev only. Never deploy this.
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: mock-uidai }
    environment:
      PORT: 3010
      MOCK_UIDAI_OTP: ${MOCK_UIDAI_OTP:-123456}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  aadhaar-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: aadhaar-service }
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/aadhaar
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-authentix}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      UIDAI_URL: http://mock-uidai:3010
      AADHAAR_HASH_SECRET: ${AADHAAR_HASH_SECRET:?set in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mock-uidai: { condition: service_healthy }

  catalog-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: catalog-service }
    environment:
      PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/catalog
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }

  inventory-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: inventory-service }
    environment:
      PORT: 3004
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/inventory
      REDIS_URL: redis://redis:6379
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-480}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  payment-service:
    # Mock gateway. Internal only: not routed by the api-gateway and no published ports.
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: payment-service }
    environment:
      PORT: 3006
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/payment
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set in .env}
      BOOKING_URL: http://booking-service:3005
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-1000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3006/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }

  booking-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: booking-service }
    environment:
      PORT: 3005
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/booking
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-authentix}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set in .env}
      ADMISSION_SECRET: ${ADMISSION_SECRET:?set in .env}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-480}
      AUTH_SERVICE_URL: http://auth-service:3001
      AADHAAR_SERVICE_URL: http://aadhaar-service:3002
      CATALOG_SERVICE_URL: http://catalog-service:3003
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3006
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      aadhaar-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }

  ticket-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: ticket-service }
    environment:
      PORT: 3007
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/ticket
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-authentix}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
      QR_MASTER_KEY: ${QR_MASTER_KEY:?set in .env}
      SCAN_GRACE_SECONDS: ${SCAN_GRACE_SECONDS:-120}
      AUTH_SERVICE_URL: http://auth-service:3001
      AADHAAR_SERVICE_URL: http://aadhaar-service:3002
      CATALOG_SERVICE_URL: http://catalog-service:3003
      BOOKING_SERVICE_URL: http://booking-service:3005
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3007/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_healthy }

  gate-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: gate-service }
    environment:
      PORT: 3008
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/gate
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
      CATALOG_SERVICE_URL: http://catalog-service:3003
      TICKET_SERVICE_URL: http://ticket-service:3007
      GATE_OPEN_BEFORE_HOURS: ${GATE_OPEN_BEFORE_HOURS:-6}
      GATE_OPEN_AFTER_HOURS: ${GATE_OPEN_AFTER_HOURS:-12}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3008/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      ticket-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }

  queue-service:
    # Waiting room for hot-sale events. Redis only: the line is temporary by nature.
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: queue-service }
    environment:
      PORT: 3009
      REDIS_URL: redis://redis:6379
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
      ADMISSION_SECRET: ${ADMISSION_SECRET:?set in .env}
      AUTH_SERVICE_URL: http://auth-service:3001
      AADHAAR_SERVICE_URL: http://aadhaar-service:3002
      CATALOG_SERVICE_URL: http://catalog-service:3003
      QUEUE_BATCH_SIZE: ${QUEUE_BATCH_SIZE:-10}
      QUEUE_INTERVAL_SECONDS: ${QUEUE_INTERVAL_SECONDS:-5}
      ADMISSION_TTL_SECONDS: ${ADMISSION_TTL_SECONDS:-600}
      QUEUE_IDLE_SECONDS: ${QUEUE_IDLE_SECONDS:-90}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3009/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      aadhaar-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }

  mailpit:
    # Dev email inbox (the maintained successor to MailHog, same ports). Nothing is ever delivered to a real address.
    # Read the mail at http://localhost:8025
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: notification-service }
    environment:
      PORT: 3012
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/notification
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-authentix}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3003
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: "Authentix <no-reply@authentix.test>"
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3012/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      auth-service: { condition: service_healthy }

  auth-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: auth-service }
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/auth
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-authentix}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      DEV_EXPOSE_VERIFICATION_TOKEN: ${DEV_EXPOSE_VERIFICATION_TOKEN:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  api-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: api-gateway }
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      AUTH_SERVICE_URL: http://auth-service:3001
      AADHAAR_SERVICE_URL: http://aadhaar-service:3002
      CATALOG_SERVICE_URL: http://catalog-service:3003
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      BOOKING_SERVICE_URL: http://booking-service:3005
      TICKET_SERVICE_URL: http://ticket-service:3007
      GATE_SERVICE_URL: http://gate-service:3008
      QUEUE_SERVICE_URL: http://queue-service:3009
      NOTIFICATION_SERVICE_URL: http://notification-service:3012
      # nginx (the web containers) is the gateway's only client and sets the real visitor address, so trust it:
      # otherwise every browser shares one rate-limit bucket. The gateway's own port is bound to localhost below.
      TRUST_PROXY: "true"
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:3000:3000" # direct access from this machine only; with TRUST_PROXY on, an outside caller could fake its address
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      auth-service: { condition: service_healthy }
      aadhaar-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      ticket-service: { condition: service_healthy }
      gate-service: { condition: service_healthy }
      queue-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api-gateway: { condition: service_healthy }

  scanner:
    # Gate staff app. The camera needs a secure context: http://localhost:8081 works, a phone over the network needs HTTPS.
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args: { APP: scanner }
    ports:
      - "8081:80"
    depends_on:
      api-gateway: { condition: service_healthy }

volumes:
  pgdata:
