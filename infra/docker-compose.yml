name: authentix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-authentix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # dev only: lets the integration tests reach Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authentix}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379" # dev only: lets the integration tests reach Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-authentix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mock-uidai:
    # Fake UIDAI for dev only. Never deploy this.
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: mock-uidai }
    environment:
      PORT: 3010
      MOCK_UIDAI_OTP: ${MOCK_UIDAI_OTP:-123456}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  aadhaar-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: aadhaar-service }
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/aadhaar
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-authentix}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      UIDAI_URL: http://mock-uidai:3010
      AADHAAR_HASH_SECRET: ${AADHAAR_HASH_SECRET:?set in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mock-uidai: { condition: service_healthy }

  catalog-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: catalog-service }
    environment:
      PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/catalog
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }

  auth-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: auth-service }
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-authentix}:${POSTGRES_PASSWORD}@postgres:5432/auth
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-authentix}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set in .env}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      DEV_EXPOSE_VERIFICATION_TOKEN: ${DEV_EXPOSE_VERIFICATION_TOKEN:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  api-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.node
      args: { SERVICE: api-gateway }
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      AUTH_SERVICE_URL: http://auth-service:3001
      AADHAAR_SERVICE_URL: http://aadhaar-service:3002
      CATALOG_SERVICE_URL: http://catalog-service:3003
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      auth-service: { condition: service_healthy }
      aadhaar-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api-gateway: { condition: service_healthy }

volumes:
  pgdata:
